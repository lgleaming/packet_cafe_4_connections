<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Packet Café · From Connections to Clues</title><style>
:root{--bg:#0d1425;--panel:#18263d;--line:#3c506d;--text:#f1f5ff;--muted:#b6c7df;--mint:#87edc1;--purple:#b5a3ff;--gold:#ffdb88}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0;overflow:hidden}body{background:#070c17;color:var(--text);font:18px/1.4 'Segoe UI',Arial,sans-serif}button,select{font:inherit}button{cursor:pointer;color:var(--text);background:#243751;border:1px solid #5b7391;border-radius:7px;padding:8px 12px}button:hover:not(:disabled){border-color:var(--mint);background:#304d61}button:disabled{opacity:.42;cursor:default}button:focus-visible,select:focus-visible{outline:3px solid var(--gold);outline-offset:2px}.primary{background:var(--mint);color:#12372f;font-weight:750}.primary:hover:not(:disabled){background:#b1f7d8;color:#12372f}.hidden{display:none!important}h1,h2,h3,p{margin:0}#stage{position:absolute;left:50%;top:50%;width:1280px;height:800px;transform-origin:center;display:grid;grid-template-rows:52px 50px 83px 1fr 48px;gap:10px;padding:0 16px 10px;background:var(--bg)}header{margin:0 -16px;padding:8px 18px;background:#101c30;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:14px}.brand{font-size:18px;font-weight:750;white-space:nowrap}.brand span{color:var(--mint)}.tools{display:flex;gap:8px;align-items:center}.tools button{font-size:12px;padding:6px 10px}.tools label{font-size:12px;color:var(--muted)}select{background:#101d31;border:1px solid #647b97;color:var(--text);padding:6px;border-radius:6px}#jump{width:280px;font-size:12px}.titlebar{display:flex;align-items:center;justify-content:space-between;gap:12px}.chapter{font-size:11px;letter-spacing:1.6px;color:var(--mint);text-transform:uppercase;font-weight:800;margin-bottom:3px}h1{font-size:29px;line-height:1.1;font-weight:750;letter-spacing:-.4px}#slidecount{color:var(--muted);font-size:14px;white-space:nowrap}.narration{display:flex;align-items:center;gap:12px;padding:8px 14px;border:1px solid #465471;background:#25314b;border-radius:12px;min-width:0}.narration svg{flex:none;width:45px;height:61px}.bytewords{flex:1;font-size:18px;line-height:1.35}.speaker{color:var(--mint);font-size:11px;font-weight:800;letter-spacing:1.8px;margin-bottom:3px}.pixel{border-left:1px solid #63708b;padding-left:12px;max-width:270px;display:flex;align-items:center;gap:7px;font-size:14px;color:var(--gold)}.pixel svg{width:37px;height:48px}main{min-height:0}.info{height:100%;display:flex;flex-direction:column;gap:13px;padding:14px 24px;background:var(--panel);border:1px solid var(--line);border-radius:12px}.lessonbody{font-size:19px;line-height:1.4}.lessonbody>p{margin:10px 0}.lessonbody>.two,.lessonbody>.three{margin:8px 0}.two,.three{display:grid;gap:18px}.two{grid-template-columns:1fr 1fr}.three{grid-template-columns:repeat(3,1fr)}.card{background:#101e32;border:1px solid var(--line);border-radius:10px;padding:16px 18px}.card h3{font-size:22px;color:var(--mint);margin-bottom:8px}.card p{line-height:1.45}.takeaway{padding:11px 15px;background:#243d43;border-left:4px solid var(--mint);border-radius:5px}.note{font-size:15px;color:var(--muted);line-height:1.4}.question{padding:11px 15px;border-left:4px solid var(--gold);border-radius:5px;background:#302e28;font-size:18px;line-height:1.35}.question small{display:block;color:var(--gold);font-size:11px;letter-spacing:.9px;font-weight:800;margin-bottom:4px}.info .question{margin-top:auto}.infoactions{display:flex;justify-content:flex-end;gap:8px}.infoactions button{font-size:13px;padding:6px 12px}table{width:100%;border-collapse:collapse;font-size:18px;line-height:1.35}th,td{text-align:left;padding:10px 13px;border-bottom:1px solid var(--line)}th{color:var(--mint);background:#122137;font-size:16px}td:first-child{font-weight:650}.ports td{font-size:17px;padding:10px 12px}.model td{padding:12px}.address{display:flex;justify-content:center;align-items:center;gap:30px;margin:18px 0}.address>div{display:grid;gap:10px;text-align:center;background:#273850;border:1px solid #5b7391;border-radius:10px;padding:20px 30px}.address b{font-size:30px}.address small{font-size:12px;color:var(--mint)}.address>strong{font-size:30px}.diagram{display:flex;justify-content:center;align-items:center;gap:15px;margin:4px 0;font-size:18px;text-align:center}.diagram .node{padding:12px 20px;background:#253751;border:1px solid #59678b;border-radius:8px}.diagram .arrow{font-size:17px;color:var(--gold);line-height:1.6}.welcomevisual{display:flex;gap:30px;justify-content:center;align-items:center;padding:5px;background:#101e32;border-radius:10px}.welcomevisual svg{width:90px;height:105px}.welcomevisual div{text-align:left;font-size:22px}.welcomevisual small{display:block;color:var(--muted);font-size:16px;margin-top:5px}.log{font:17px/1.65 Consolas,monospace;color:#b8f4d9;background:#091423;border:1px solid #344a61;border-radius:9px;padding:13px 15px;margin:10px 0}.watchgrid{height:100%;display:grid;grid-template-columns:740px minmax(0,1fr);gap:14px}.scene{height:100%;min-height:0;display:flex;flex-direction:column;background:#111e32;border:1px solid var(--line);border-radius:12px;overflow:hidden}.roomlabel{display:flex;justify-content:space-between;padding:7px 12px;font-size:11px;letter-spacing:.5px;background:#24344e;flex:none}.room{flex:1;min-height:0;display:flex;align-items:center;justify-content:center}.room svg{width:100%;height:100%;display:block}.room svg text{font-family:'Segoe UI',Arial,sans-serif}.services{display:grid;grid-template-columns:1fr 1fr 1fr;gap:7px;padding:7px 10px;flex:none;background:#1b2b43}.svc{padding:7px 10px;border:2px solid #526782;border-radius:8px;background:#102039;font-size:14px}.svc small{display:block;color:var(--muted);font-size:12px;margin-top:2px}.svc.active{border-color:var(--mint);background:#24483f}.svc.closed.active{border-color:var(--gold);background:#4c3930}.event{padding:9px 12px;background:#0b1629;min-height:62px;flex:none;border-top:1px solid var(--line);font-size:15px;line-height:1.4}.event strong{color:var(--gold)}.event small{font-size:12px;color:var(--muted)}.side{height:100%;min-height:0;display:flex;flex-direction:column;gap:12px}.sidecontent{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:15px;display:flex;flex-direction:column;gap:11px;flex:1;min-height:0}.side .lessonbody{font-size:18px}.side .note{font-size:14px}.side .question{font-size:17px;margin-top:auto}.smallcard{padding:12px 14px;border:1px solid var(--line);background:#0e1c31;border-radius:8px;line-height:1.7}.side .log{font-size:15px;padding:10px;line-height:1.6;margin:0}.actionpanel{padding:11px;background:#1a2b43;border:1px solid var(--line);border-radius:12px;display:grid;gap:8px;flex:none}.actionrow{display:flex;gap:7px}.actionrow>*{flex:1;min-width:0}.actionrow button{font-size:14px;padding:9px 5px}.settings{display:flex;justify-content:space-between;gap:8px;align-items:center;font-size:12px}.settings label{display:flex;gap:6px;align-items:center}.settings select{font-size:12px;padding:4px}input{accent-color:var(--mint)}.playstate{font-size:12px;color:var(--mint);min-height:17px}.explain{font-size:13px;padding:6px 9px}.recordtag{padding:9px 11px;border:1px solid #716947;color:var(--gold);border-radius:6px;background:#302e28;font-size:14px}.packetbox{background:#192b43;padding:9px 11px;border-top:1px solid var(--line);flex:none;min-height:139px}.packetheading{display:flex;justify-content:space-between;font-size:12px;color:var(--muted);margin-bottom:7px}.packetheading strong{color:var(--mint)}.packetstack{display:flex;align-items:stretch;gap:5px;height:79px}.packetpart{display:flex;flex-direction:column;justify-content:center;padding:8px;border:2px solid #526785;background:#10223b;border-radius:6px;flex:1;font-size:12px;line-height:1.4;opacity:.3}.packetpart{transition:opacity .25s,border-color .25s,background .25s}.packetpart strong{font-size:11px;margin-bottom:4px;color:var(--mint)}.packetpart.present{opacity:1}.packetpart.justadded{border-color:var(--gold);background:#37403a}.packetpart.data{flex:1.2}.packetlegend{font-size:11px;color:var(--muted);margin-top:6px}.statuspill{display:inline-block;padding:3px 7px;background:#1e3d38;border-radius:5px;font-size:12px;color:var(--mint)}footer{display:flex;align-items:center;justify-content:space-between;gap:12px}footer button{font-size:14px;min-width:110px;padding:7px 14px}.footnote{font-size:12px;color:var(--muted);text-align:center}.footerhint{color:var(--purple);font-size:11px}#modal{position:fixed;inset:0;background:#020814df;display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}.modalbox{background:#18312e;border:2px solid var(--mint);border-radius:12px;padding:25px;max-width:900px;width:90vw}.modalhead{display:flex;align-items:center;justify-content:space-between;gap:18px;margin-bottom:18px}.modalhead h2{font-size:25px}#answer{font-size:20px;line-height:1.6}.modalhead button{font-size:15px}.hidden{display:none!important}#printsheet{display:none}@media print{html,body{overflow:visible;height:auto;background:white;color:black}body>*{display:none!important}#printsheet{display:block!important;font:14px/1.5 Arial}#printsheet h1{font-size:25px;margin-bottom:12px}#printsheet h2{font-size:18px;margin:16px 0 8px}#printsheet svg{height:290px;width:100%}#printsheet svg text{fill:#111}#printsheet svg rect{fill:white;stroke:#555}#printsheet svg path,#printsheet svg polyline{stroke:#555}.writing{height:38px;border-bottom:1px solid #999}}

</style></head><body><div id="stage"><header><div class="brand">PACKET CAFÉ <span>/</span> Connections → Clues</div><div class="tools"><label>Slide <select id="jump" aria-label="Go to slide"></select></label><button id="print">Pair diagram</button><button id="fullscreen">Full screen</button></div></header><div class="titlebar"><div><div id="chapter" class="chapter"></div><h1 id="title"></h1></div><span id="slidecount"></span></div><div class="narration"><div id="byteAvatar"></div><div class="bytewords"><div class="speaker">BYTE · YOUR CAFÉ GUIDE</div><div id="byte"></div></div><div id="pixel" class="pixel hidden"></div></div><main id="main"></main><footer><button id="previous">← Previous</button><div class="footnote">Fictional classroom model · teacher controlled<div class="footerhint">Use ← / → to change slides · explanations stay hidden until you reveal them</div></div><div class="nextcontrols"><button id="bridge" class="bridgebutton">Byte’s transition</button><button id="next" class="primary">Next →</button></div></footer></div><div id="modal" class="hidden" role="dialog" aria-modal="true" aria-labelledby="modalTitle"><div class="modalbox"><div class="modalhead"><h2 id="modalTitle">Discussion explanation</h2><button id="close">Close ✕</button></div><div class="popupcontent"><div id="popupByte" class="hidden"></div><div id="answer"></div></div><div id="popupActions" class="hidden"><button id="continue" class="primary">Continue to next slide →</button></div></div></div><section id="printsheet"></section><script>
const slides=[{"chapter": "A normal café day", "title": "Welcome, café technicians!", "byte": "I’m Byte. You’ve already helped build this network. Today we’ll follow a normal café visit: open the menu webpage, then join a game. I’ll explain the new pieces as we go.", "body": "<div class=\"two\"><article class=\"card\"><h3>Your job</h3><p>Explain how the café’s computers and programs communicate.</p></article><article class=\"card\"><h3>Why it matters</h3><p>Later, you’ll use the same knowledge to understand a security problem. First, let’s see what normal looks like.</p></article></div>", "kind": "info", "visual": "welcome", "anim": "", "prompt": "With your partner, name one device in this café and explain its job.", "answer": "Examples: a switch forwards local Ethernet frames; a router connects networks; a computer runs client or server programs.", "pixel": "Normal day. Excellent snack potential.", "incident": false, "transition": "Let’s start our normal café day. PC1 wants to open the menu webpage. Which program asks for it, and which program responds?"}, {"chapter": "Programs that communicate", "title": "A client asks. A server responds.", "byte": "PC1’s browser is about to request our menu page. The browser is the client program. A web server program on the café server computer responds.", "body": "<div class=\"two\"><article class=\"card\"><h3>Client program</h3><p>Starts a request.<br><b>Example:</b> the browser on PC1.</p></article><article class=\"card\"><h3>Server program</h3><p>Responds to requests.<br><b>Example:</b> Apache on the café server.</p></article></div>", "kind": "info", "visual": "roles", "anim": "", "prompt": "Which program requests the menu page? Which program responds?", "answer": "The browser requests it. Apache, the web server program, responds. We also use “server” to mean the computer running server software.", "pixel": "", "incident": false, "transition": "We know who asks and who responds. Now let’s separate three things that can get mixed up: the server computer, Apache, and the webpage files."}, {"chapter": "Programs that communicate", "title": "Computer, program, and content", "byte": "We’ll use Apache in our cybersecurity work, so let’s name it now. The café server is the computer. Apache is the web server program running on it. Our HTML and CSS files are the website content.", "body": "<div class=\"three\"><article class=\"card\"><h3>1 · Computer</h3><p>Café server<br><b>192.168.1.20</b></p></article><article class=\"card\"><h3>2 · Program</h3><p><b>Apache HTTP Server</b><br>Listens for web requests</p></article><article class=\"card\"><h3>3 · Content</h3><p><b>menu.html + styles.css</b><br>Page files stored on the server</p></article></div><p class=\"takeaway\">When the browser requests the café menu page, Apache sends the requested files back in web responses.</p>", "kind": "info", "visual": "apache", "anim": "", "prompt": "A student says, “The HTML file is the web server program.” What would you explain?", "answer": "The HTML file is content. Apache is the running program that responds to browser requests. The café server is the computer storing the files and running Apache.", "pixel": "", "incident": false, "transition": "Apache is the program, and the menu files are its content. The job Apache provides over the network is called a service. What does that mean?"}, {"chapter": "Services", "title": "A service is a job software does", "byte": "Think of the school office: one place can provide attendance help, transcripts, and visitor check-in. One server computer can also offer several services—but software does these jobs.", "body": "<div class=\"two\"><article class=\"card\"><h3>Plain-language definition</h3><p>A <b>network service</b> is a job that running software does for other programs over a network.</p></article><article class=\"card\"><h3>At Packet Café</h3><p>Apache provides the <b>web service</b>: it responds to requests for webpages.<br><br>A different program provides the <b>game service</b>.</p></article></div>", "kind": "info", "visual": "", "anim": "", "prompt": "In the office analogy, what corresponds to the services? What corresponds to the server computer?", "answer": "The different kinds of help are the services. The office is like the shared location/computer. It is an analogy: in the network, running programs provide the services.", "pixel": "One café. More than one job. Mine is morale.", "incident": false, "transition": "One computer can provide several services, just as one office offers different kinds of help. Let’s connect that idea to services you already use."}, {"chapter": "Services", "title": "You use network services every day", "byte": "Here are familiar examples. For each one, notice the client’s request and the job the service performs. A service is not necessarily a separate computer.", "body": "<table><tr><th>Client action</th><th>Service</th><th>What it provides</th></tr><tr><td>Browser opens a site</td><td>Web</td><td>Webpage content</td></tr><tr><td>Game client joins a match</td><td>Game</td><td>Session information and game updates</td></tr><tr><td>Music app plays a track</td><td>Streaming</td><td>Audio data</td></tr><tr><td>Student opens a shared folder</td><td>File sharing</td><td>Access to stored files</td></tr><tr><td>Device looks up a domain name</td><td>DNS</td><td>An IP address associated with the name</td></tr></table>", "kind": "info", "visual": "", "anim": "", "prompt": "Choose one row. Explain who asks and what the service sends back.", "answer": "Example: the music app requests a track; software providing the streaming service returns audio data.", "pixel": "", "incident": false, "transition": "Webpages, games, music, and shared files all involve services. Back at our café, two of those jobs happen on the same local server computer."}, {"chapter": "The local café server", "title": "Our menu page lives on the LAN", "byte": "Our server at 192.168.1.20 runs Apache and a separate fictional game server program. “Web” describes the service—it does not mean the page must be somewhere on the internet.", "body": "<div class=\"two\"><article class=\"card\"><h3>Local webpage</h3><p>Apache hosts the café menu and tournament schedule.<br><b>PC1’s browser → Apache</b></p></article><article class=\"card\"><h3>Local game</h3><p>The game program hosts our practice match.<br><b>PC1’s game client → game program</b></p></article></div><p class=\"takeaway\">Both programs run on one local computer. Local access can keep working when the café’s internet connection is down.</p>", "kind": "info", "visual": "local", "anim": "", "prompt": "Does PC1 need the router to reach the café server on the same subnet?", "answer": "No. PC1 and the café server communicate through the switch on this LAN. The local page does not need an internet trip.", "pixel": "", "incident": false, "transition": "Our local server runs Apache and the game program. Let’s watch PC1 request the menu first, then ask to join the game."}, {"chapter": "Watch a normal exchange", "title": "Menu first. Then the game.", "byte": "Watch PC1’s browser request the menu page and receive it. Then PC1’s game client asks to join the local game. We are showing the application requests and replies here; we’ll examine connection setup later.", "body": "<div class=\"smallcard\"><b>Web:</b> “Get /menu.html” → café menu page<br><b>Game:</b> “Join the practice match” → session information</div>", "kind": "watch", "visual": "", "anim": "services", "prompt": "After each reply, name the program that responded and what it provided.", "answer": "Apache returned the menu page. The game server program returned game-session information. Both programs run on the same café server computer.", "pixel": "", "incident": false, "transition": "Two different requests reached two programs on the same computer. How does the computer know which program should receive the traffic? That brings us to logical ports."}, {"chapter": "Ports", "title": "Physical sockets and logical ports", "byte": "You know physical Ethernet ports from building the LAN. Now we need another meaning of “port”: a number used by networking software to reach a program.", "body": "<div class=\"two\"><article class=\"card\"><h3>Physical Ethernet port</h3><p>A socket where a cable plugs into a computer or switch.<br><b>You can touch it.</b></p></article><article class=\"card\"><h3>Logical port</h3><p>A numbered endpoint used by TCP or UDP to help deliver traffic to a program.<br><b>It is managed in software.</b></p></article></div><p class=\"takeaway\">The web and game programs can use different logical ports while sharing the same computer and Ethernet cable.</p>", "kind": "info", "visual": "ports", "anim": "", "prompt": "Which kind of port takes a cable? Which kind helps select a listening program?", "answer": "A physical socket takes the Ethernet cable. A logical TCP/UDP port helps the operating system deliver traffic to the right program.", "pixel": "", "incident": false, "transition": "A physical port takes a cable; a logical port helps reach a program. Let’s learn what some common port numbers mean and the communication rules used by those services."}, {"chapter": "Protocols and common ports", "title": "Rules for communicating", "byte": "A protocol is an agreed set of rules for exchanging information. HTTP sets rules for web requests and responses. SSH sets rules for securely signing in to another computer and using its command line.", "body": "<table class=\"ports\"><tr><th>Common TCP port</th><th>Protocol / example</th><th>Plain-language purpose</th></tr><tr><td>80</td><td><b>HTTP</b> · Hypertext Transfer Protocol</td><td>Request and return webpages; HTTP alone does not encrypt them</td></tr><tr><td>443</td><td><b>HTTPS</b> · HTTP Secure</td><td>Exchange web content over an encrypted connection</td></tr><tr><td>22</td><td><b>SSH</b> · Secure Shell</td><td>Securely sign in to another computer and run commands</td></tr><tr><td>25565</td><td><b>Minecraft Java</b> default game port</td><td>Connect to a Minecraft Java server</td></tr></table><p class=\"note\">Our fictional café game uses TCP 25565, borrowing Minecraft Java’s common default. Other games use other ports. Port numbers can be reconfigured; a number alone does not prove which program is running.</p>", "kind": "info", "visual": "", "anim": "", "prompt": "Use the table: which protocol would help you securely use another computer’s command line?", "answer": "SSH, commonly on TCP 22. We will connect this idea to command-line work later. Use the table as a reference; no port-number memorization is required.", "pixel": "", "incident": false, "transition": "The table gives us familiar service ports. Now put one together with the server’s IP address: which part identifies the computer, and which part helps reach its service?"}, {"chapter": "IP address + service port", "title": "Which computer? Which service?", "byte": "The IP address identifies our destination computer on this network. The destination TCP port helps that computer deliver the connection to the correct listening program.", "body": "<div class=\"address\"><div><small>DESTINATION IP</small><b>192.168.1.20</b><span>The café server computer</span></div><strong>+</strong><div><small>DESTINATION TCP PORT</small><b>80 · HTTP</b><span>Apache’s listening endpoint</span></div></div><p class=\"takeaway\">Think: school address → right building; office counter → the help you need.</p>", "kind": "info", "visual": "", "anim": "", "prompt": "Keep the destination IP but change TCP 80 to TCP 25565. What changes?", "answer": "The same computer is reached, but the destination endpoint changes from Apache’s web service to our configured game service. The cable route can stay the same.", "pixel": "", "incident": false, "transition": "We’ve paired an IP address with a service port. Let’s watch the web and game requests again, this time checking which destination detail changes."}, {"chapter": "Watch ports select a service", "title": "Same route. Different receiving program.", "byte": "We’ll repeat the normal requests with their destination details visible. First use TCP 80 for Apache. Then use TCP 25565 for the game. Watch the receiving service highlight after the envelope reaches the server.", "body": "<div class=\"smallcard\"><b>192.168.1.20 · TCP 80</b> → Apache / local webpage<br><b>192.168.1.20 · TCP 25565</b> → game service</div>", "kind": "watch", "visual": "", "anim": "ports", "prompt": "Before the game request: predict what will change and what will stay the same.", "answer": "The destination port and receiving program change. The destination computer/IP and physical path stay the same.", "pixel": "", "incident": false, "transition": "The same path reached two listening services. But what if we choose a port where no program is ready to accept a connection?"}, {"chapter": "Available services", "title": "Is a program listening?", "byte": "A listening—or open—port means a program is ready to accept connections there. On our café server, Apache listens on TCP 80 and the game listens on TCP 25565.", "body": "<div class=\"two\"><article class=\"card\"><h3>Open / listening</h3><p>A program is available at that endpoint.<br><b>Open does not automatically mean vulnerable.</b></p></article><article class=\"card\"><h3>No listener in our model</h3><p>No SSH server program is running on TCP 22.<br>The server refuses a connection attempt there.</p></article></div><p class=\"note\">In other configurations a firewall may drop traffic instead. This example shows an explicit refusal.</p>", "kind": "info", "visual": "", "anim": "", "prompt": "Does finding an open port prove someone can sign in to the service?", "answer": "No. It shows that a service can accept connections. Whether a user can sign in or perform an action is a separate application-level question.", "pixel": "", "incident": false, "transition": "Our server has no SSH service listening on TCP 22. Let’s watch what happens when a technician tries that endpoint anyway."}, {"chapter": "Watch a refused connection", "title": "No SSH service here", "byte": "Imagine a technician tries SSH to run commands on the café server. SSH commonly uses TCP 22, but we have not enabled an SSH service. Watch the attempt reach the computer and a refusal return.", "body": "<div class=\"smallcard\"><b>SSH:</b> secure remote sign-in and command-line access.<br><b>Our server:</b> no SSH program listening on TCP 22.</div>", "kind": "watch", "visual": "", "anim": "refused", "prompt": "Did the attempt reach the computer? Did it establish an SSH connection?", "answer": "It reached the computer, which returned a TCP reset (RST) in this example. No SSH connection was established. This is a connection refusal, not a rejected username/password.", "pixel": "", "incident": false, "transition": "That attempt was refused. What happens when a TCP service does accept a new connection? We’ll slow down and examine the three-way handshake."}, {"chapter": "TCP", "title": "The TCP three-way handshake", "byte": "TCP—Transmission Control Protocol—helps deliver data reliably and in order. This handshake starts a new TCP connection. Use “When do we need a handshake?” to compare it with ARP, DHCP, and ping.", "body": "<div class=\"three handshake\"><article class=\"card\"><h3>1 · SYN</h3><p>Client: “Let’s start a connection.”</p></article><article class=\"card\"><h3>2 · SYN-ACK</h3><p>Server: “I received that; let’s connect.”</p></article><article class=\"card\"><h3>3 · ACK</h3><p>Client: “Confirmed.”</p></article></div><p class=\"takeaway\">A <b>three-way handshake establishes a new TCP connection</b>. It is not repeated for every request sent over an existing connection.</p><p class=\"note\">The phrases simplify TCP’s connection-control messages. We are leaving out sequence-number details.</p>", "kind": "info", "visual": "", "anim": "", "prompt": "Which device starts? What exists after the three messages?", "answer": "The client starts. After SYN, SYN-ACK, and ACK, the TCP connection is established. Application requests can then use that connection.", "pixel": "", "incident": false, "transition": "We know when the handshake is needed: to establish a new TCP connection. Now watch the browser connect to Apache, then send its actual HTTP request."}, {"chapter": "Watch TCP connect", "title": "Connect first; request the page afterward", "byte": "The browser is connecting to Apache at TCP 80. These first three envelopes are TCP connection-control messages—not HTTP webpage requests. After ACK, we’ll send the actual menu request.", "body": "<div class=\"smallcard\">SYN → SYN-ACK → ACK → <b>HTTP request</b> → webpage response</div>", "kind": "watch", "visual": "", "anim": "handshake", "prompt": "At which step does the browser actually ask for /menu.html?", "answer": "After the handshake, when it sends the HTTP request. Port 80 identifies the endpoint during setup too; it does not make a SYN message an HTTP request. An existing connection can carry more than one request.", "pixel": "", "incident": false, "transition": "The handshake established communication, and Apache returned the menu. Does a working TCP connection also mean a player has successfully signed in to an account?"}, {"chapter": "Connection versus account access", "title": "A connection can work while a sign-in fails", "byte": "Now switch to the game service. A player’s game client has connected to TCP 25565. Next, the player submits a username and password to sign in to a game account.", "body": "<div class=\"two\"><article class=\"card\"><h3>TCP connection</h3><p>The programs can exchange data. TCP uses acknowledgments and retransmissions to help handle missing data and deliver it in order.</p></article><article class=\"card\"><h3>Game account sign-in</h3><p>The game program checks the submitted credentials—such as a username and password—and accepts or rejects them.</p></article></div><p class=\"takeaway\">“Login failed” means the sign-in was rejected. It does not mean that the cable or TCP connection failed.</p>", "kind": "info", "visual": "", "anim": "", "prompt": "If the service sends back “Login failed,” what had to work for that reply to arrive?", "answer": "The client reached the service and received its application response over the network. The account credentials were rejected. A working connection is not successful account access.", "pixel": "", "incident": false, "transition": "A game account checks credentials after the connection is available. Let’s watch an ordinary mistake: Alex submits the wrong password."}, {"chapter": "Watch a normal sign-in mistake", "title": "Wrong password. Working connection.", "byte": "This is a practice example, before any security incident. Player Alex submits the wrong password to the game service. Watch the service return “Login failed.” That reply tells us the request reached the program.", "body": "<div class=\"smallcard\"><b>Already connected:</b> PC1’s game client → TCP 25565.<br><b>Request:</b> sign in as Alex.<br><b>Reply:</b> login failed—credentials rejected.</div>", "kind": "watch", "visual": "", "anim": "practiceLogin", "prompt": "Separate the outcomes: did communication work? Was the sign-in accepted?", "answer": "Communication worked: the application received the sign-in request and replied. The sign-in failed. A player’s typo alone is not evidence of an attack.", "pixel": "Even experts can mistype. I blame paws.", "incident": false, "transition": "The game replied even though Alex’s sign-in failed. To explain those different outcomes, we’ll organize the jobs of communication using the TCP/IP model."}, {"chapter": "The TCP/IP model", "title": "Four layers organize the jobs", "byte": "The four-layer TCP/IP model is a way to organize the jobs involved in network communication. It helps us explain what we see and narrow down what part of a conversation we are investigating.", "body": "<table class=\"model\"><tr><th>Layer</th><th>Job in our example</th><th>What you recognize</th></tr><tr><td>Application</td><td>Make and understand the request/response</td><td>HTTP menu request; game sign-in</td></tr><tr><td>Transport</td><td>Manage communication between programs</td><td>TCP connections and ports</td></tr><tr><td>Internet</td><td>Address and route IP packets</td><td>Source/destination IP addresses</td></tr><tr><td>Network Access</td><td>Deliver across the local link</td><td>Ethernet, MAC addresses, switch</td></tr></table>", "kind": "info", "visual": "", "anim": "", "prompt": "Which layer helps explain a rejected game login? Which helps explain its TCP connection?", "answer": "Application: the game program accepts or rejects the login. Transport: TCP establishes the connection and carries the application data.", "pixel": "", "incident": false, "transition": "The four layers give us a way to organize the conversation. Now let’s build a simplified request and watch each layer add the information needed for delivery."}, {"chapter": "Watch information wrap the message", "title": "Build a request, then unpack it", "byte": "Watch a simplified message gain delivery information, called headers: TCP details, IP addresses, then Ethernet/MAC details. The server processes those outer layers until Apache receives the HTTP request.", "body": "", "kind": "watch", "visual": "", "anim": "packetRequest", "prompt": "Why does the message need more than just “Get the menu”?", "answer": "The network needs delivery information: which programs, which IP endpoints, and which local Ethernet endpoints. Apache interprets the HTTP request after the receiving stack processes that information.", "pixel": "", "incident": false, "transition": "Apache received the request after the server processed its delivery information. What about the menu response? The server must build delivery information for that reply too."}, {"chapter": "Watch the response", "title": "The reply gets its own delivery information", "byte": "Apache creates a response containing the menu page. The server adds TCP, IP, and local Ethernet delivery information. PC1 processes those layers and passes the response to its browser. Both requests and replies go through this process.", "body": "", "kind": "watch", "visual": "", "anim": "packetReply", "prompt": "Does the server send the page back with no addresses because it is a reply?", "answer": "No. The reply has its own delivery information. At the receiving PC, that information is processed so the response reaches the browser. Both directions involve building and unpacking layered messages.", "pixel": "", "incident": false, "transition": "We’ve followed normal communication in both directions. Now the normal day changes: the game service has reported failed attempts to use a staff account."}, {"chapter": "A security concern appears", "title": "Byte receives a game-service alert", "byte": "Our normal-day walkthrough is complete. Now the game service reports three failed attempts to sign in to the staff manager account. Let’s use our networking knowledge to investigate what happened.", "body": "<div class=\"two\"><article class=\"card\"><h3>The staff manager account</h3><p>Café staff use it to manage tournaments and game settings. Customers should not try to sign in as manager.</p></article><article class=\"card\"><h3>What we know so far</h3><p>Three failed manager sign-ins were recorded from <b>192.168.1.99</b>.<br>We have not established successful access.</p></article></div><p class=\"takeaway\">Our questions: Which device used that address? What did it contact? Were the attempts authorized? Did any sign-in succeed?</p>", "kind": "info", "visual": "alert", "anim": "", "prompt": "Why would failed manager sign-ins deserve attention even though a customer’s typo might be harmless?", "answer": "The account has staff privileges, and the pattern is repeated. We need device, authorization, and outcome evidence before deciding what the activity means.", "pixel": "New job: keep calm. Check the records.", "incident": true, "transition": "The alert tells us something deserves investigation; it does not prove successful access. Let’s identify which records can answer our questions."}, {"chapter": "How we investigate", "title": "Four records. One connected story.", "byte": "These are records from the café’s systems, prepared for our fictional case. Each answers a different question. We’ll read what it says, trace the relevant connection, and separate facts from guesses.", "body": "<table><tr><th>Record</th><th>What it helps us find out</th></tr><tr><td>1 · DHCP lease list</td><td>Which device held 192.168.1.99 during the incident</td></tr><tr><td>2 · Connection-monitor summary</td><td>Which server ports that device contacted</td></tr><tr><td>3 · Game login log + manager confirmation</td><td>Which account it tried and whether it had permission</td></tr><tr><td>4 · Sign-in outcome review</td><td>Whether successful access is recorded in this window</td></tr></table>", "kind": "info", "visual": "", "anim": "", "prompt": "Which record would you check to identify the device? Which would help determine whether it signed in?", "answer": "DHCP/device records help associate the IP with a device at that time. The game sign-in records help determine the recorded account-access outcome.", "pixel": "", "incident": true, "transition": "Each record answers a different question. First we’ll use DHCP and a device check to find out which device held the address shown in the alert."}, {"chapter": "Evidence 1 · Identify the device", "title": "Who held 192.168.1.99?", "byte": "Our DHCP lease list associates .99 with the customer laptop during this window. The café’s device check confirms the laptop’s MAC matches the record. A lease tells us about address assignment—not permission or intent.", "body": "<div class=\"log\">10:14–10:20 · active lease<br>IP: 192.168.1.99 /24<br>MAC: 02:CA:FE:00:00:99<br>Device check: customer laptop</div><p>This slide inspects an existing record. No request/reply is being sent.</p>", "kind": "record", "visual": "lease", "anim": "", "prompt": "Label the laptop’s IP. Does its DHCP lease prove it was allowed to use the manager account?", "answer": "No. It connects this local address to the laptop in the stated time window, supported by the device check. Permission to use an account is a separate question. This identifies a device, not the person who typed.", "pixel": "", "incident": true, "transition": "The lease and device check link .99 to the laptop during this window. They do not establish permission. Next, which services did that laptop contact?"}, {"chapter": "Evidence 2 · Reach the services", "title": "What did that laptop contact?", "byte": "The laptop tries three TCP ports on the café server. Each successful connection to Apache or the game uses its own three-way handshake. Watch SYN, SYN-ACK, and ACK; then compare TCP 22, where the server refuses the attempt.", "body": "<div class=\"log\">Source: .99 → destination: .20<br>10:15:02 · TCP 80 · connected<br>10:15:04 · TCP 25565 · connected<br>10:15:06 · TCP 22 · refused</div><p class=\"note\">The replay shows both successful handshakes and the refused attempt.</p>", "kind": "watch", "visual": "", "anim": "scan", "prompt": "Which services were reachable? Does checking several ports by itself prove a break-in?", "answer": "Apache on TCP 80 and the game on TCP 25565 accepted connections; TCP 22 refused. This pattern can be service discovery. It warrants context, but does not by itself prove unauthorized account access.", "pixel": "", "incident": true, "transition": "The laptop reached Apache and the game service, while TCP 22 refused the attempt. Now let’s inspect what it asked the game service to do."}, {"chapter": "Evidence 3 · Account attempts", "title": "Connected to the game. Rejected at sign-in.", "byte": "The game log now links the laptop’s IP to three failed manager sign-ins. The manager confirms that this customer had no permission to try the staff account. Watch one of the recorded attempts—not a successful login.", "body": "<div class=\"log\">Game service · TCP 25565<br>10:16:01 · .99 · manager · FAILED<br>10:16:05 · .99 · manager · FAILED<br>10:16:09 · .99 · manager · FAILED</div>", "kind": "watch", "visual": "", "anim": "incidentLogin", "prompt": "What worked at the connection level? What failed at the account level? What establishes that the attempts were unauthorized?", "answer": "The laptop reached the game service over TCP. The sign-in attempts failed at the application level. The manager’s confirmation establishes lack of permission in this fictional case; the IP or port number alone does not.", "pixel": "", "incident": true, "transition": "The game rejected the manager sign-ins, and the manager says they were not authorized. Next, check the outcome records: is any successful session recorded?"}, {"chapter": "Evidence 4 · Establish the outcome", "title": "Do the records show successful access?", "byte": "We review the game service’s sign-in outcomes for 10:14–10:20. It records three failures and no successful manager session from this source. That supports a limited conclusion; it is not a complete audit of the whole network.", "body": "<div class=\"log\">Source: 192.168.1.99<br>Failed logins: 3<br>Successful logins: 0<br>Recorded manager session: none<br>Scope: game service · 10:14–10:20</div>", "kind": "record", "visual": "outcome", "anim": "", "prompt": "State one supported conclusion and one claim these records do not prove.", "answer": "Supported: unauthorized manager sign-in attempts occurred, and no successful session is recorded here. Not proven: a successful break-in—or that every service and time window is safe.", "pixel": "", "incident": true, "transition": "These records support unauthorized attempts, with no successful access established in this window. Let’s name the networking knowledge that helped us reach that conclusion."}, {"chapter": "Why networking matters", "title": "Networking turns records into explanations", "byte": "You did cybersecurity work by using networking knowledge. Without it, these would be disconnected numbers and error messages. Here is what each idea let us establish.", "body": "<table><tr><th>Networking knowledge</th><th>How it helped this investigation</th></tr><tr><td>IP + MAC + DHCP records</td><td>Associated activity with a local device during a stated window</td></tr><tr><td>Subnet + switch path</td><td>Explained how the laptop reached the local server</td></tr><tr><td>Services + ports</td><td>Identified which programs the laptop tried to reach</td></tr><tr><td>TCP connection</td><td>Separated reaching a program from signing into an account</td></tr><tr><td>Application replies + logs</td><td>Distinguished rejected sign-ins from recorded successful access</td></tr></table>", "kind": "info", "visual": "", "anim": "", "prompt": "Choose one row. Explain what you could have misunderstood without that networking knowledge.", "answer": "Example: Without understanding TCP versus application responses, we might mistake “connected” for “logged in,” or assume “login failed” means a broken network.", "pixel": "The clues made more sense once we knew how delivery works.", "incident": true, "transition": "We can now explain how addresses, services, ports, TCP, and application responses helped the investigation. Put two of those connections into your own explanation for the manager."}, {"chapter": "Explain your findings", "title": "Make the networking → cybersecurity connection", "byte": "Tell the manager what the records support. Then explain why your networking knowledge mattered. The goal is a justified explanation, not simply naming a suspicious laptop.", "body": "<div class=\"two\"><article class=\"card\"><h3>Pair conclusion</h3><p>Choose the strongest record for your claim.<br>Explain what it shows and what remains unknown.</p></article><article class=\"card\"><h3>Individual exit response</h3><p>Choose <b>two networking ideas</b> and explain how each helped you investigate the café incident.</p></article></div><p class=\"takeaway\">Next: command-line tools will let us inspect addresses, routes, and services on authorized classroom lab systems.</p>", "kind": "info", "visual": "", "anim": "", "prompt": "Complete: “Knowing _____ helped me establish _____ because the evidence showed _____.”", "answer": "Example: Knowing service ports helped me distinguish a connection to the game from a connection to Apache. Knowing TCP versus account access helped me explain why the game could respond “login failed.” Overall: unauthorized attempts; no successful access established by these records.", "pixel": "", "incident": true, "transition": "You used networking knowledge to turn records into a supported explanation. In our next unit, we’ll use command-line tools to inspect addresses, routes, and services on classroom lab systems."}];
function sprite(who,size=48){const c=who==='Byte'?'#a5e8df':who==='Pixel'?'#efb187':who==='Nova'?(false?'#87edc1':'#b59bff'):(false?'#87edc1':'#f4ba7e');let shapes='';if(who==='Byte'){shapes=`<path fill="${false?'#ffdb88':'#b5a3ff'}" d="M5 9h22v4H5zM3 12h4v13H3zM25 12h4v13h-4z"/><path fill="${c}" d="M8 10h16v15H8zM10 27h12v11H10zM6 29h4v9H6zM22 29h4v9h-4zM10 38h5v5h-5zM18 38h5v5h-5z"/><path fill="#18273a" d="M10 13h12v9H10z"/><path fill="#87edc1" d="M12 15h2v3h-2zM18 15h2v3h-2zM14 20h4v1h-4z"/><path fill="#fff" d="M13 29h6v3h-6z"/>`}else if(who==='Pixel'){shapes=`<g class="tail"><path fill="${c}" d="M25 29h6v-8h-3v5h-3z"/></g><path fill="${c}" d="M5 19h6v-8h5v5h7v-5h5v20h-3v7H8v-7H5z"/><path fill="#f8d1af" d="M10 28h13v7H10z"/><path fill="#273146" d="M10 21h3v3h-3zM21 21h3v3h-3zM16 26h3v2h-3z"/><path fill="#fff" d="M8 37h7v3H8zM20 37h6v3h-6z"/>`}else{const skin=who==='Nova'?'#b77f64':'#f0be91';shapes=`<path fill="${who==='Nova'?'#2d2046':'#734535'}" d="M10 6h15v16H8V11h2z"/><path fill="${skin}" d="M11 11h12v13H11zM6 29h4v8H6zM25 29h4v8h-4z"/><path fill="${c}" d="M10 25h15v14H10zM7 27h3v8H7zM25 27h3v8h-3z"/><path fill="#18253e" d="M11 39h5v6h-5zM20 39h5v6h-5zM13 16h2v2h-2zM20 16h2v2h-2z"/><path fill="#fff" d="M10 44h7v3h-7zM20 44h7v3h-7z"/>${who==='Patch'?'<path fill="#30334b" d="M9 14h7v6H9zM18 14h7v6h-7zM16 16h2v2h-2z"/><path fill="#a5c0d9" d="M17 29h3v7h-3z"/>':'<path fill="#483164" d="M9 7h16v6H9zM6 12h5v7H6z"/>'}`};return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 34 50" width="${size}" height="${size}" shape-rendering="crispEdges" aria-label="${who}" role="img">${shapes}</svg>`}

function room(incident=false,record=''){return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="5 48 690 375" role="img" aria-label="Packet Café local network. Four PCs connect to a switch; a local server and router connect to the switch. ${incident?'A customer laptop is connected too.':''} The server cable stops at its Ethernet socket."><defs><pattern id="tiles" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" stroke="#26394e" stroke-width=".5" fill="none"/></pattern></defs><rect x="5" y="4" width="690" height="422" rx="12" fill="#132239"/><rect x="12" y="75" width="676" height="345" fill="url(#tiles)"/>${atSprite('Byte',345,329,48)}${atSprite('Pixel',399,338,42)}<text x="368" y="395" text-anchor="middle" fill="#87edc1" font-size="10">BYTE</text><text x="420" y="395" text-anchor="middle" fill="#efb187" font-size="10">PIXEL</text><g fill="none" stroke="#698ba2" stroke-width="4" stroke-linejoin="round"><path d="M139 148H177V226H332"/><path d="M300 148H313V226H332"/><path d="M139 322H177V265H332"/><path d="M300 322H313V265H332"/><path id="serverCable" d="M427 247H456V215H485"/><path d="M390 227V90H484"/>${incident?'<path id="laptopCable" d="M565 360V391H394V269"/>':''}</g>${computer(40,119,1)}${computer(201,119,2)}${computer(40,293,3)}${computer(201,293,4)}<g><text x="379" y="214" text-anchor="middle" fill="#fff" font-size="16" font-weight="700">Switch</text><rect x="332" y="227" width="95" height="42" rx="6" fill="#274857" stroke="#87edc1" stroke-width="2"/>${Array.from({length:6},(_,i)=>`<rect x="${339+i*14}" y="245" width="10" height="10" fill="#102239" stroke="#87edc1"/>`).join('')}</g><g><rect x="484" y="59" width="185" height="57" rx="7" fill="#24334e" stroke="#b5a3ff" stroke-width="2"/><text x="576" y="82" text-anchor="middle" fill="#fff" font-size="17">Router · 192.168.1.1</text><text x="576" y="103" text-anchor="middle" fill="#b6c7df" font-size="12">To modem / internet</text></g><g id="serverDevice"><rect x="485" y="146" width="190" height="139" rx="8" fill="#24334d" stroke="#b5a3ff" stroke-width="2"/><text x="580" y="169" text-anchor="middle" fill="#fff" font-size="18" font-weight="700">Café server</text><text x="580" y="190" text-anchor="middle" fill="#d7ceff" font-size="16">192.168.1.20</text><rect id="serverSocket" x="480" y="207" width="10" height="16" rx="1" fill="#0c1829" stroke="#87edc1" stroke-width="2"/><text x="500" y="215" fill="#a9bbd3" font-size="10">Ethernet socket</text><rect id="webGlow" x="500" y="225" width="160" height="22" rx="4" fill="#16273f"/><text x="580" y="241" text-anchor="middle" fill="#a8f1d1" font-size="13">Apache · local webpage</text><rect id="gameGlow" x="500" y="253" width="160" height="22" rx="4" fill="#16273f"/><text x="580" y="269" text-anchor="middle" fill="#d0c3ff" font-size="13">Game server program</text></g>${incident?`<g>${atSprite('Guest',547,294,48)}<rect x="503" y="353" width="138" height="13" rx="4" fill="#6b5849"/><path d="M530 315H599L610 353H519Z" fill="#0a1729" stroke="#b2c7e0" stroke-width="2"/><text x="565" y="339" text-anchor="middle" fill="#87edc1" font-size="13">LAPTOP</text><rect x="561" y="355" width="8" height="10" fill="#11263b" stroke="#87edc1"/><text x="569" y="414" text-anchor="middle" fill="#d0dded" font-size="14">Customer laptop · .99</text></g>`:'<text x="570" y="340" text-anchor="middle" fill="#b6c7df" font-size="15">Local server · two programs</text><text x="570" y="365" text-anchor="middle" fill="#839bb8" font-size="13">No internet trip needed</text>'}${record==='lease'?'<rect x="501" y="302" width="145" height="70" rx="8" fill="none" stroke="#ffdb88" stroke-width="3"/><path d="M565 392H394V269" fill="none" stroke="#ffdb88" stroke-width="4" stroke-dasharray="7 6"/>':''}${record==='outcome'?'<rect x="482" y="143" width="196" height="145" rx="9" fill="none" stroke="#ffdb88" stroke-width="3"/>':''}<g id="motion"></g></svg>`;}
function visual(name){if(name==='welcome')return `<div class="welcomevisual">${sprite('Byte',96)}${sprite('Pixel',86)}<div>Meet your café guide and morale manager.<small>Byte explains the network. Pixel occasionally has opinions.</small></div></div>`;if(name==='roles')return `<div class="diagram"><div class="node"><b>Browser on PC1</b><br>CLIENT</div><div class="arrow">Request: get the menu →<br>← Reply: menu page</div><div class="node"><b>Apache on the server</b><br>SERVER PROGRAM</div></div>`;if(name==='apache')return `<div class="diagram"><div class="node">Browser request<br><b>Get /menu.html</b></div><div class="arrow">→</div><div class="node">Apache reads the requested file<br><b>and sends a response</b></div><div class="arrow">→</div><div class="node">Browser displays<br><b>the menu page</b></div></div>`;if(name==='local')return `<div class="diagram"><div class="node">PC1 · 192.168.1.10</div><div class="arrow">↔ switch ↔</div><div class="node">LAN server · 192.168.1.20<br>Apache + game program</div></div>`;if(name==='ports')return `<div class="diagram"><div class="node">Ethernet cable → physical socket</div><div class="arrow">then software delivers to</div><div class="node">TCP 80 → Apache<br>TCP 25565 → game</div></div>`;if(name==='alert')return `<div class="diagram"><div class="node" style="border-color:var(--gold)"><b>GAME SERVICE ALERT</b><br>Manager account · 3 failed sign-ins · source .99</div></div>`;return '';}

function render(){stop();$('#modal').classList.add('hidden');const s=slides[current];$('#chapter').textContent=s.chapter;$('#title').textContent=s.title;$('#slidecount').textContent=`${current+1} / ${slides.length}`;$('#byte').textContent=s.byte;$('#pixel').innerHTML=s.pixel?`${sprite('Pixel',40)}<span>${s.pixel}</span>`:'';$('#pixel').classList.toggle('hidden',!s.pixel);$('#jump').innerHTML=slides.map((v,i)=>`<option value="${i}" ${i===current?'selected':''}>${i+1}. ${v.title}</option>`).join('');const question=`<div class="question"><small>${s.kind==='watch'?'WATCH · THEN EXPLAIN':s.kind==='record'?'READ THE RECORD · DISCUSS':'CHECK UNDERSTANDING'}</small>${s.prompt}</div>`;if(s.kind==='info'){$('#main').innerHTML=`<section class="info">${visual(s.visual)}<div class="lessonbody">${s.body}</div>${question}<div class="infoactions">${current===13?'<button id="handshakeExamples">When do we need a handshake?</button>':''}<button class="explain">Show explanation</button></div></section>`;}else{const packet=s.anim.startsWith('packet');$('#main').innerHTML=`<div class="watchgrid"><section class="scene"><div class="roomlabel"><b>PACKET CAFÉ · LOCAL NETWORK</b><span>192.168.1.0/24</span></div><div class="room">${room(s.incident,s.visual)}</div>${servicePanel(s.anim)}<div class="event" id="event">${s.kind==='record'?'<strong>Inspect an existing record.</strong><br>No live packets are being sent.':'<strong>Ready.</strong> Press Play to begin one exchange.'}</div></section><div class="side"><section class="sidecontent">${packet?packetBox():''}<div class="lessonbody">${s.body}</div>${question}</section>${s.kind==='watch'?`<section class="actionpanel"><div class="playstate" id="playstate">Teacher controlled · pauses after each step</div><div class="actionrow"><button id="play" class="primary">▶ Play / replay</button><button id="step" disabled>Next step →</button><button id="pause" disabled>Pause</button></div><div class="settings"><label>Speed <select id="speed"><option value="5000">Standard · 5s</option><option value="7500">Slower · 7.5s</option><option value="3000">Faster · 3s</option></select></label><label><input id="auto" type="checkbox"> Auto-advance</label></div><button class="explain">Show explanation</button></section>`:'<section class="actionpanel"><div class="recordtag">Record inspection · no animation controls</div><button class="explain">Show explanation</button></section>'}</div></div>`;if(packet)drawPacket({layers:[],owner:s.anim==='packetReply'?'Server / Apache · ready':'PC1 / browser · ready',direction:s.anim==='packetReply'?'reply':'request'});}document.querySelectorAll('.explain').forEach(b=>b.onclick=()=>showAnswer(b));if($('#handshakeExamples'))$('#handshakeExamples').onclick=showHandshakeExamples;$('#bridge').textContent=current===slides.length-1?'Byte’s wrap-up':'Byte’s transition';if($('#play')){$('#play').onclick=start;$('#step').onclick=()=>run&&run.index<run.steps.length-1&&startStep(run.index+1);$('#pause').onclick=pause;}$('#previous').disabled=current===0;$('#next').disabled=current===slides.length-1;}
const routes={pc:[[139,148],[177,148],[177,226],[332,226],[332,247],[427,247],[456,247],[456,215],[480,215]],laptop:[[565,360],[565,391],[394,391],[394,269],[394,247],[427,247],[456,247],[456,215],[480,215]]};
function exchange(kind,label,port,reverse=false,options={}){const p=slides[current].incident?routes.laptop:routes.pc;return {kind,label,port,reverse,path:reverse?[...p].reverse():p,...options};}
function sequence(){const a=slides[current].anim;const q=(port,text)=>exchange('REQUEST',text,port);const r=(port,text)=>exchange('REPLY',text,port,true);if(a==='services'||a==='ports')return[q('80','Browser requests /menu.html'),r('80','Apache returns the café menu page'),q('25565','Game client asks to join the practice match'),r('25565','Game service returns session information')];if(a==='refused')return[exchange('SYN','Try to establish a connection to TCP 22','22',false,{state:'Connecting'}),exchange('RST','Server refuses: no SSH service listening','22',true,{state:'Connection refused'})];if(a==='handshake')return[exchange('SYN','TCP setup: client asks to connect to Apache','80',false,{state:'Connecting · not an HTTP request'}),exchange('SYN-ACK','TCP setup: server acknowledges and responds','80',true,{state:'Connecting · not a webpage reply'}),exchange('ACK','TCP setup: client confirms the connection','80',false,{state:'TCP connection established'}),{...q('80','HTTP request: GET /menu.html'),state:'Connected · HTTP request now sent'},r('80','HTTP response: Apache returns the menu page')];if(a==='practiceLogin')return[{...q('25565','Sign in as Alex · wrong password submitted'),state:'TCP connected · sign-in pending'},{...r('25565','Login failed · credentials rejected'),state:'TCP connected · sign-in failed'}];if(a==='incidentLogin')return[{...q('25565','Recorded attempt: sign in as manager'),state:'TCP connected · unauthorized sign-in attempt'},{...r('25565','Login failed · manager sign-in rejected'),state:'TCP connected · sign-in failed'}];if(a==='scan')return[exchange('SYN','Laptop asks to connect to Apache · TCP 80','80',false,{state:'TCP 80 · connecting'}),exchange('SYN-ACK','Apache endpoint acknowledges and responds · TCP 80','80',true,{state:'TCP 80 · connecting'}),exchange('ACK','Laptop confirms · TCP 80 connection established','80',false,{state:'TCP 80 · connected'}),exchange('SYN','Laptop asks to connect to the game · TCP 25565','25565',false,{state:'TCP 25565 · connecting'}),exchange('SYN-ACK','Game endpoint acknowledges and responds · TCP 25565','25565',true,{state:'TCP 25565 · connecting'}),exchange('ACK','Laptop confirms · TCP 25565 connection established','25565',false,{state:'TCP 25565 · connected'}),exchange('SYN','Laptop tries TCP 22 · commonly SSH','22',false,{state:'TCP 22 · connecting'}),exchange('RST','Server refuses · no SSH service listening on TCP 22','22',true,{state:'TCP 22 · connection refused'})];if(a==='packetRequest'||a==='packetReply'){const reply=a==='packetReply',from=reply?'Server / Apache':'PC1 / browser',to=reply?'PC1 / browser':'Server / Apache',dir=reply?'reply':'request';const stage=(label,layers,owner,flash)=>({kind:'INSPECT',label,port:'80',stationary:true,layers,owner,direction:dir,flash});return[stage(`${from} creates the application ${dir}`,['data'],from,'data'),stage('TCP adds information for communication between programs',['data','tcp'],from,'tcp'),stage('IP adds source and destination addresses',['data','tcp','ip'],from,'ip'),stage('Ethernet adds local source and destination MAC addresses',['data','tcp','ip','ethernet'],from,'ethernet'),exchange(reply?'REPLY':'REQUEST',`${reply?'Menu response':'Menu request'} crosses the local Ethernet path`,'80',reply,{layers:['data','tcp','ip','ethernet'],owner:'On the LAN',direction:dir}),stage(`${to} processes Ethernet/MAC delivery information`,['data','tcp','ip'],to,'ip'),stage(`${to} processes IP addressing information`,['data','tcp'],to,'tcp'),stage('TCP delivers application data to the receiving program',['data'],to,'data'),stage(reply?'The browser receives the menu page':'Apache reads GET /menu.html',['data'],to,'data')];}return [];}
function drawPacket(st){if(!$('#packetStack'))return;const reply=st.direction==='reply',src=reply?'192.168.1.20':'192.168.1.10',dst=reply?'192.168.1.10':'192.168.1.20',smac=reply?'02:CA:FE:00:00:20':'02:CA:FE:00:00:10',dmac=reply?'02:CA:FE:00:00:10':'02:CA:FE:00:00:20';const defs=[['ethernet','Network Access',`From ${smac}<br>To ${dmac}`],['ip','Internet',`From ${src}<br>To ${dst}`],['tcp','Transport',reply?'TCP · from web service 80':'TCP · to web service 80'],['data','Application',reply?'Menu page content':'GET /menu.html']];$('#packetStack').innerHTML=defs.map(([id,title,value])=>`<div class="packetpart ${id==='data'?'data':''} ${st.layers?.includes(id)?'present':''} ${st.flash===id?'justadded':''}"><strong>${title}</strong>${st.layers?.includes(id)?`<span>${value}</span>`:''}</div>`).join('');$('#packetOwner').textContent=st.owner||'Layered message';}
function point(path,t){const lengths=path.slice(1).map((p,i)=>Math.hypot(p[0]-path[i][0],p[1]-path[i][1]));let remaining=t*lengths.reduce((a,b)=>a+b,0);for(let i=0;i<lengths.length;i++){if(remaining<=lengths[i]){const f=remaining/lengths[i];return[path[i][0]+(path[i+1][0]-path[i][0])*f,path[i][1]+(path[i+1][1]-path[i][1])*f];}remaining-=lengths[i];}return path.at(-1);}
function draw(st,t){if(st.layers)drawPacket(st);const s=slides[current],color=st.reverse?'#b5a3ff':'#87edc1',receiving=st.stationary?st.owner?.startsWith('Server'):t===1||st.reverse;document.querySelectorAll('[data-port]').forEach(el=>el.classList.toggle('active',el.dataset.port===st.port&&receiving));if($('#webGlow')){$('#webGlow').setAttribute('fill',st.port==='80'&&receiving?'#34634f':'#16273f');$('#gameGlow').setAttribute('fill',st.port==='25565'&&receiving?'#514176':'#16273f');}if(st.stationary){const x=st.owner?.startsWith('PC1')?90:580;$('#motion').innerHTML=`<circle cx="${x}" cy="${x===90?148:215}" r="29" fill="none" stroke="#ffdb88" stroke-width="3"/>`;}else{const [x,y]=point(st.path,t);$('#motion').innerHTML=`<polyline points="${st.path.map(p=>p.join(',')).join(' ')}" fill="none" stroke="${color}" stroke-width="6" opacity=".35"/><g transform="translate(${x} ${y})"><circle r="28" fill="${color}" opacity=".15"/><rect x="-20" y="-14" width="40" height="28" rx="3" fill="${color}" stroke="#0c1b2b" stroke-width="2"/><path d="M-19-12L0 2L19-12M-19 12L-6 0M19 12L6 0" fill="none" stroke="#152b3a" stroke-width="2"/><rect x="-40" y="18" width="80" height="22" rx="4" fill="#071323"/><text y="34" text-anchor="middle" fill="${color}" font-size="12" font-weight="800">${st.kind}</text></g>`;}const service=st.port==='80'?'HTTP / Apache':st.port==='25565'?'game':'SSH endpoint';const detail=st.stationary?'Layer information is added at the sender and processed at the receiver.':s.anim==='services'?'Application exchange · connection setup will be examined later.':st.reverse?`${service} · ${s.incident?'Back to customer laptop':st.port==='25565'?'Back to PC1’s game client':'Back to PC1’s browser'}`:`Destination ${s.incident?'192.168.1.20':'192.168.1.20'} · TCP ${st.port} · ${service}`;$('#event').innerHTML=`<strong>${st.kind} · ${st.label}</strong><br><small>${detail}</small>`;}
function stop(){generation++;cancelAnimationFrame(raf);run=null;playing=false;}
function start(){stop();run={steps:sequence(),index:0,elapsed:0,last:0};if(run.steps.length)startStep(0);}
function startStep(i){cancelAnimationFrame(raf);const token=++generation;run.index=i;run.elapsed=0;run.last=performance.now();playing=true;$('#step').disabled=true;$('#step').classList.remove('primary');$('#play').classList.remove('primary');$('#pause').disabled=false;$('#pause').textContent='Pause';$('#play').textContent='↻ Replay from start';$('#playstate').textContent=`Playing · step ${i+1} of ${run.steps.length}`;draw(run.steps[i],0);raf=requestAnimationFrame(n=>tick(n,token));}
function tick(now,token){if(token!==generation||!run||!playing)return;run.elapsed+=Math.max(0,now-run.last);run.last=now;const st=run.steps[run.index],duration=st.stationary?1700:+$('#speed').value,t=Math.min(1,run.elapsed/duration);draw(st,t);if(t===1){playing=false;$('#pause').disabled=true;const last=run.index===run.steps.length-1;$('#step').disabled=last;$('#step').classList.toggle('primary',!last);$('#play').classList.remove('primary');$('#playstate').textContent=`${st.state||'Step complete'} · ${last?'sequence complete':'paused for discussion'}`;if(!last&&$('#auto').checked){const started=now;const hold=n=>{if(token!==generation||!run)return;if(n-started>=1500)startStep(run.index+1);else raf=requestAnimationFrame(hold);};raf=requestAnimationFrame(hold);}return;}raf=requestAnimationFrame(n=>tick(n,token));}
function pause(){if(!run)return;if(playing){playing=false;generation++;cancelAnimationFrame(raf);$('#pause').textContent='Resume';$('#playstate').textContent='Paused · press Resume to continue';}else{playing=true;const token=++generation;run.last=performance.now();$('#pause').textContent='Pause';raf=requestAnimationFrame(n=>tick(n,token));}}
function preparePopup(button,title,withByte=false){previousFocus=button;$('#modalTitle').textContent=title;$('#popupByte').innerHTML=withByte?`${sprite('Byte',120)}<strong>BYTE</strong>`:'';$('#popupByte').classList.toggle('hidden',!withByte);$('#popupActions').classList.add('hidden');$('#modal').classList.remove('hidden');$('#close').focus();}
function showAnswer(button){preparePopup(button,'Discussion explanation');$('#answer').textContent=slides[current].answer;}
function showTransition(){preparePopup($('#bridge'),current===slides.length-1?'Byte’s wrap-up':'Byte’s transition',true);$('#answer').innerHTML=`<p class="bridgemessage">${slides[current].transition}</p>${current<slides.length-1?`<p class="nexttopic">NEXT · SLIDE ${current+2}<br><b>${slides[current+1].title}</b></p>`:''}`;$('#popupActions').classList.toggle('hidden',current===slides.length-1);}
function showHandshakeExamples(){preparePopup($('#handshakeExamples'),'When do we need a TCP handshake?',true);$('#answer').innerHTML=`<p class="exampleintro">This handshake starts a <b>new TCP connection</b>. ARP, DHCP, and ping do not use TCP.</p><table class="exampletable"><tr><th>New TCP connection → handshake</th><th>These exchanges do not use TCP</th></tr><tr><td>Browser connects to Apache using <b>HTTP over TCP</b></td><td><b>ARP:</b> discovers a local MAC address</td></tr><tr><td>Technician starts an <b>SSH session</b></td><td><b>DHCP:</b> uses UDP to obtain network settings</td></tr><tr><td>Player connects to our <b>TCP game service</b></td><td><b>Ping:</b> uses ICMP to test connectivity</td></tr></table><p class="existingconnection"><b>Already connected?</b> Another request over the same TCP connection does <b>not</b> need another handshake.</p>`;}
function closeAnswer(){$('#modal').classList.add('hidden');previousFocus?.focus();}
function move(delta){if(!$('#modal').classList.contains('hidden'))return;const next=current+delta;if(next>=0&&next<slides.length){current=next;render();}}
function fit(){const scale=Math.min(innerWidth/1280,innerHeight/800);$('#stage').style.transform=`translate(-50%,-50%) scale(${scale})`;}
$('#byteAvatar').innerHTML=sprite('Byte',48);$('#jump').onchange=e=>{current=+e.target.value;render();};$('#bridge').onclick=showTransition;$('#continue').onclick=()=>{closeAnswer();move(1);};$('#previous').onclick=()=>move(-1);$('#next').onclick=()=>move(1);$('#close').onclick=closeAnswer;$('#modal').onclick=e=>{if(e.target===$('#modal'))closeAnswer();};$('#fullscreen').onclick=()=>document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen();$('#print').onclick=()=>{$('#printsheet').innerHTML=`<h1>Packet Café / Connections → Clues</h1><p>Partners: _____________________________________ Date: _____________</p><p>Label the client, switch, café server, and laptop. Trace the laptop’s local route to the server.</p>${room(true)}<h2>Four records</h2><p>1. DHCP lease: which device held .99? Does assignment establish permission?</p><div class="writing"></div><p>2. Connection summary: which services answered?</p><div class="writing"></div><p>3. Login log: distinguish the connection outcome from the account outcome.</p><div class="writing"></div><p>4. Outcome review: what is supported, and what remains unknown?</p><div class="writing"></div><h2>Individual exit response</h2><p>Choose two networking ideas. Explain how each helped you investigate the incident.</p><div class="writing"></div><div class="writing"></div>`;window.print();};document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeAnswer();return;}if(['SELECT','INPUT','BUTTON'].includes(e.target.tagName))return;if(e.key==='ArrowRight')move(1);if(e.key==='ArrowLeft')move(-1);});window.addEventListener('resize',fit);render();fit();
